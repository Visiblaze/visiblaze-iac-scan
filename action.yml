# visiblaze-iac-scan — infrastructure-as-code scanning, on your runner.
#
# ── What leaves your runner ──
#
# Findings and declarations. Never your code.
#
# That distinction is enforced rather than promised. Trivy's own report carries the offending
# source verbatim, at Results[].Misconfigurations[].CauseMeta.Code.Lines[].Content, so this action
# does NOT forward it. The scanner normalises on this machine into a shape with no field for file
# content: a rule id, a severity, a path, a line, a resource address. The source is read here, used
# to derive that address, and left behind.
#
# ── Why a runner and not our servers ──
#
# Because the alternative is handing us your repository. Infrastructure code carries account ids,
# bucket names, network topology and IAM policy; a promise not to keep it is weaker than never
# receiving it.
#
# ── Pull requests ──
#
# On a pull_request event this action scans and sends the merge base as well as the head, because the
# platform's pull-request check compares the two by exact commit.
name: Visiblaze IaC scan
description: Scan infrastructure code on your own runner. Findings and locations are sent; source never is.
branding:
  icon: layers
  color: blue

inputs:
  tenant:
    description: Your Visiblaze tenant id. Required — a scan filed against the wrong tenant is not recoverable by re-running.
    required: true
  api-url:
    description: >-
      The ingest endpoint Visiblaze gave you. Checked against the allowlist in pins.env; an
      action that posts wherever it is told is an exfiltration primitive, not a security tool.
    required: false
    default: ""
  repo-key:
    description: 'Visiblaze repository key ("github#<numeric id>"). Defaults to this repository.'
    required: false
    default: ""
  path:
    description: Directory to scan, relative to the workspace. The whole checkout by default.
    required: false
    default: "."
  fail-on:
    description: >-
      Fail the job when a finding at or above this severity is present: critical, high, medium or
      low. Empty means report only, which is the right default for a check nobody is gating on yet.
    required: false
    default: ""
  timeout:
    description: >-
      Overall scan budget. MEASURED: this repository's own infra/ tree takes ~5m35s, and a 6m
      budget timed out on one of two runs — so the default has deliberate headroom.
    required: false
    default: "14m"
  fail-on-error:
    description: >-
      Whether OUR failure breaks your build. Defaults to false: a scanner outage must not be the
      reason your pipeline goes red. It does not govern `fail-on`, which is your own result.
    required: false
    default: "false"
  dry-run:
    description: >-
      Scan and report what would be sent, upload nothing. Booleans accept true/false, yes/no, 1/0
      and on/off in any case; anything else is refused.
    required: false
    default: "false"

outputs:
  findings:
    description: Number of findings in the payload.
    value: ${{ steps.scan.outputs.findings }}
  declarations:
    description: Number of resource declarations located.
    value: ${{ steps.scan.outputs.declarations }}
  complete:
    description: >-
      Whether the scan read everything it was pointed at. FALSE with zero findings is not a clean
      repository, and a consumer that treats the two alike will report an all-clear for a scan
      that never finished.
    value: ${{ steps.scan.outputs.complete }}
  status:
    description: One of complete, failed, skipped-no-infrastructure.
    value: ${{ steps.scan.outputs.status }}
  delivery-status:
    description: >-
      Did this run deliver its result, in the vocabulary every Visiblaze action uses: `sent`,
      `dry-run` or `failed`. `status` says whether the SCAN completed; this says whether it reached
      Visiblaze.
    value: ${{ steps.scan.outputs.delivery-status }}

runs:
  using: composite
  steps:
    - id: scan
      shell: bash
      env:
        IN_TENANT: ${{ inputs.tenant }}
        IN_API_URL: ${{ inputs.api-url }}
        IN_REPO_KEY: ${{ inputs.repo-key }}
        IN_PATH: ${{ inputs.path }}
        IN_FAIL_ON: ${{ inputs.fail-on }}
        IN_TIMEOUT: ${{ inputs.timeout }}
        IN_FAIL_ON_ERROR: ${{ inputs.fail-on-error }}
        IN_DRY_RUN: ${{ inputs.dry-run }}
        GH_REPOSITORY: ${{ github.repository }}
        GH_REPOSITORY_ID: ${{ github.repository_id }}
        # github.ref_name is "5/merge" on a pull_request event, a ref that exists only on GitHub's
        # side; head_ref is the pull request's real branch and is empty on every other event.
        GH_REF_NAME: ${{ github.head_ref || github.ref_name }}
        GH_EVENT: ${{ github.event_name }}
        # The repository a pull request's head lives in. Differs from GH_REPOSITORY only for a pull
        # request from a fork, the one case GitHub issues no OIDC token.
        PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        # The pull request's HEAD, not github.sha: on a pull_request event github.sha is GitHub's
        # synthetic merge commit, a sha the platform never looks up, so an upload filed under it is
        # stored and then read by nothing.
        GH_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        # Set on pull_request events only. The check compares this run's head against an upload
        # for the merge base, so a pull-request run scans and sends both.
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        BASE_REF: ${{ github.event.pull_request.base.ref }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        ACTION_DIR: ${{ github.action_path }}
      run: |
        set -uo pipefail

        # ── Booleans, validated ─────────────────────────────────────────────────────────
        #
        # Anything not clearly true or false is refused, with exit 1 whatever fail-on-error says:
        # `dry-run: 'True'` must never fall through to a real upload, and `fail-on-error: 'yes'`
        # must not quietly mean "no".
        norm_bool() {
          case "$(printf '%s' "$2" | tr 'A-Z' 'a-z')" in
            true|yes|1|on)     printf 'true'  ;;
            false|no|0|off|"") printf 'false' ;;
            *) echo "::error::visiblaze-iac: ${1} must be true or false, got '${2}'" >&2
               printf 'invalid' ;;
          esac
        }
        IN_DRY_RUN="$(norm_bool dry-run "${IN_DRY_RUN:-}")"
        IN_FAIL_ON_ERROR="$(norm_bool fail-on-error "${IN_FAIL_ON_ERROR:-}")"
        if [ "$IN_DRY_RUN" = "invalid" ] || [ "$IN_FAIL_ON_ERROR" = "invalid" ]; then
          printf 'status=failed\ndelivery-status=failed\nfindings=\ndeclarations=\ncomplete=false\n' >> "$GITHUB_OUTPUT"
          exit 1
        fi

        # bail() is AVAILABILITY: a download that will not download, an ingest that is down or
        # refuses, no OIDC token. Ours, and governed by fail-on-error, so an outage on our side is
        # never the reason a pipeline goes red unless the caller asked for that.
        STATUS="failed"
        bail() {
          local level="$1"; shift
          echo "::${level}::visiblaze-iac: $*"
          echo "status=${STATUS}" >> "$GITHUB_OUTPUT"
          echo "delivery-status=failed" >> "$GITHUB_OUTPUT"
          printf 'findings=\ndeclarations=\ncomplete=false\n' >> "$GITHUB_OUTPUT"
          # Once the scan has counted findings at the customer's fail-on bar, OUR failure after
          # that point (no token, a refused upload) must not switch THEIR gate off: the findings
          # are real whether or not we stored them. Zero before the scan, so earlier failures
          # are untouched.
          if [ "${HIT:-0}" -gt 0 ]; then
            echo "::error::visiblaze-iac: ${HIT} finding(s) at or above ${IN_FAIL_ON}"
            exit 2
          fi
          if [ "${IN_FAIL_ON_ERROR}" = "true" ]; then exit 1; fi
          exit 0
        }

        # fatal() is INTEGRITY and CONFIGURATION, and it ignores fail-on-error: a digest or
        # signature that does not verify, a pin that is missing, an api-url this action may not post
        # to, a path outside the checkout, an input value nobody can run. None is an outage, and a
        # green job on any of them is indistinguishable from a clean scan.
        fatal() {
          echo "::error::visiblaze-iac: $*"
          echo "status=failed" >> "$GITHUB_OUTPUT"
          echo "delivery-status=failed" >> "$GITHUB_OUTPUT"
          printf 'findings=\ndeclarations=\ncomplete=false\n' >> "$GITHUB_OUTPUT"
          exit 1
        }

        [ -n "${IN_TENANT}" ] || fatal "tenant is required — a scan filed against no tenant is discarded"

        # fail-on is checked like the booleans, and for a worse reason: an unrecognised value used
        # to reach jq as a null threshold, and every finding compares >= null, so "hgih" failed the
        # job on its first info-level finding.
        case "${IN_FAIL_ON}" in
          ""|critical|high|medium|low) ;;
          *) fatal "fail-on must be one of critical, high, medium, low (or empty), got '${IN_FAIL_ON}'" ;;
        esac
        # A Go duration, as the scanner expects. A typo would make the scan fail, and a failed scan
        # is a bail(), so `timeout: 14` would quietly turn the check off.
        printf '%s' "${IN_TIMEOUT}" | grep -Eq '^([0-9]+(\.[0-9]+)?(ns|us|µs|ms|s|m|h))+$' \
          || fatal "timeout must be a Go duration such as 14m, got '${IN_TIMEOUT}'"

        # ── The caller's inputs are checked BEFORE anything is fetched ───────────────────
        #
        # Order matters and was got wrong first: with the pins check ahead of these, a bad path or
        # a disallowed origin was reported as "no pinned release", and neither guard could be
        # exercised at all until a release existed. A security control that has never run is not a
        # control. Cheap checks first also means the common mistakes get the accurate message.
        #
        # pins.env is READ here, though, because the origin allowlist lives in it. Read after the
        # origin check, as it first was, the check saw an unset variable on every run and refused
        # every upload however the file was filled in. Sourcing it also overwrites any
        # ALLOWED_API_ORIGINS the calling job set in its own env, so a workflow cannot widen the
        # allowlist for itself. Whether the file names a release is still asked further down.
        PINS="${ACTION_DIR}/pins.env"
        [ -f "$PINS" ] || fatal "pins.env is missing from the action — refusing to fetch anything unpinned"
        # shellcheck disable=SC1090
        . "$PINS"

        # ── The API origin ──────────────────────────────────────────────────────────────
        if [ "${IN_DRY_RUN}" != "true" ]; then
          if [ -z "${ALLOWED_API_ORIGINS:-}" ]; then
            fatal "pins.env allows no ingest origin, so this scan cannot be sent. Run with dry-run: true, which scans and reports without sending."
          fi
          [ -n "${IN_API_URL}" ] || fatal "api-url is required — use the ingest endpoint Visiblaze gave you"
          case "${IN_API_URL}" in
            https://*) ;;
            *) fatal "api-url must be https, got '${IN_API_URL}'" ;;
          esac
          origin="$(printf '%s' "${IN_API_URL}" | sed -E 's#^(https://[^/]+).*#\1#')"
          case " ${ALLOWED_API_ORIGINS} " in
            *" ${origin} "*) ;;
            *) fatal "api-url origin ${origin} is not one this action is allowed to post to" ;;
          esac
        fi

        # ── The scan path must stay inside the checkout ─────────────────────────────────
        #
        # Resolved and compared, not pattern-matched: `../` is not the only way out, and a
        # symlink is not visible in the string at all.
        WS="$(pwd -P)"
        TARGET="$(cd "${IN_PATH}" 2>/dev/null && pwd -P)" \
          || bail error "path '${IN_PATH}' does not exist in the checkout"
        case "${TARGET}" in
          "${WS}"|"${WS}"/*) ;;
          *) fatal "path '${IN_PATH}' resolves outside the checkout" ;;
        esac

        # ── Pins ────────────────────────────────────────────────────────────────────────
        if [ -z "${SCANNER_VERSION:-}" ] || [ -z "${SCANNER_SHA256_LINUX_AMD64:-}" ]; then
          fatal "this action has no pinned scanner release yet, so there is nothing it can verify and run. See pins.env."
        fi
        # The release signature is required, not optional: the digest says these are the bytes this
        # action commit names, the signature says our release workflow built them.
        [ "${SCANNER_SIGNED:-}" = "true" ] || fatal "pins.env does not require the release signature (SCANNER_SIGNED=${SCANNER_SIGNED:-<unset>}); refusing to run an unsigned scanner"
        for k in SCANNER_CERT_IDENTITY_REGEXP SCANNER_CERT_OIDC_ISSUER COSIGN_URL_LINUX_AMD64 COSIGN_SHA256_LINUX_AMD64 COSIGN_URL_LINUX_ARM64 COSIGN_SHA256_LINUX_ARM64; do
          case "$(eval "printf '%s' \"\${${k}:-}\"")" in
            ''|UNSET) fatal "${k} is not pinned in pins.env — the release signature cannot be checked" ;;
          esac
        done

        case "$(uname -s)" in
          Linux) ;;
          *) bail error "unsupported runner OS $(uname -s); Visiblaze publishes Linux builds only" ;;
        esac

        REPO_KEY="${IN_REPO_KEY}"
        [ -n "${REPO_KEY}" ] || REPO_KEY="github#${GH_REPOSITORY_ID}"

        echo "::notice::visiblaze-iac: this action does not upload your source. Findings carry a path and a line; file contents are read on this runner and left here."

        # ── Fetch and verify ────────────────────────────────────────────────────────────
        WORK="$(mktemp -d)"
        chmod 700 "${WORK}"
        # The cleanup for everything this step leaves in the caller's checkout: the merge-base
        # worktree (registered in their repository, so removed there, not just its directory) and
        # the ref fetched for it. A self-hosted runner keeps the checkout between jobs.
        BASE_WT=""
        BASE_REF_FETCHED=""
        cleanup() {
          if [ -n "${BASE_WT}" ]; then
            git -C "${WS}" worktree remove --force "${BASE_WT}" >/dev/null 2>&1 || true
            git -C "${WS}" worktree prune >/dev/null 2>&1 || true
          fi
          [ -z "${BASE_REF_FETCHED}" ] || git -C "${WS}" update-ref -d refs/visiblaze/base >/dev/null 2>&1 || true
          rm -rf "${WORK}"
        }
        trap cleanup EXIT

        verify() {
          local file="$1" want="$2" actual
          if command -v sha256sum >/dev/null 2>&1; then
            actual="$(sha256sum "$file" | awk '{print $1}')"
          elif command -v shasum >/dev/null 2>&1; then
            actual="$(shasum -a 256 "$file" | awk '{print $1}')"
          else
            fatal "no sha256sum or shasum on this runner — cannot verify a download, so nothing will be executed"
          fi
          [ "$(printf '%s' "$actual" | tr 'A-Z' 'a-z')" = "$(printf '%s' "$want" | tr 'A-Z' 'a-z')" ] \
            || fatal "digest mismatch on $(basename "$file"): expected ${want}, got ${actual}. Nothing was executed. Either the pin is stale or the artefact changed; do not 'fix' this by updating the digest without finding out which."
        }

        # ONE artefact, ONE digest. Trivy and its Rego checks ship inside our release bundle
        # rather than being fetched separately, so this digest covers all three. Two downloads
        # would mean two things to verify and one more URL to be wrong about; shellcheck caught
        # the first draft assigning a Trivy digest it then never checked, which is exactly the
        # shape of a supply-chain gap that reads as covered.
        #
        # The BUNDLE, not visiblaze-iac_<v>_*.tar.gz. That archive is the scanner alone, which is
        # what every other consumer of the binary wants; this action refused it at the engine check
        # below (v0.1.1 measured: one file, no trivy, no checks).
        case "$(uname -m)" in
          x86_64|amd64)  ARCH=amd64; SCANNER_WANT="${SCANNER_SHA256_LINUX_AMD64}"; COSIGN_URL="${COSIGN_URL_LINUX_AMD64}"; COSIGN_WANT="${COSIGN_SHA256_LINUX_AMD64}" ;;
          aarch64|arm64) ARCH=arm64; SCANNER_WANT="${SCANNER_SHA256_LINUX_ARM64:-}"; COSIGN_URL="${COSIGN_URL_LINUX_ARM64}"; COSIGN_WANT="${COSIGN_SHA256_LINUX_ARM64}" ;;
          *) bail error "unsupported runner architecture $(uname -m)" ;;
        esac
        [ -n "${SCANNER_WANT}" ] || fatal "pins.env names no digest for linux/${ARCH}, so nothing can be verified and run"

        BUNDLE="${WORK}/bundle"
        mkdir -p "${BUNDLE}"
        TGZ="visiblaze-iac-bundle_${SCANNER_VERSION}_linux_${ARCH}.tar.gz"
        curl -fsSL --retry 3 -o "${WORK}/${TGZ}" "${SCANNER_BASE_URL}/${SCANNER_VERSION}/${TGZ}" \
          || bail error "could not download ${TGZ}"
        verify "${WORK}/${TGZ}" "${SCANNER_WANT}"

        # Provenance on top of the digest: the bundle's Sigstore signature, checked with a pinned
        # cosign against our release workflow's identity. Keyless verification reads Sigstore's
        # trust root; a runner behind a TLS-intercepting proxy must let sigstore.dev through. Never
        # skipped.
        curl -fsSL --retry 3 -o "${WORK}/cosign" "${COSIGN_URL}" \
          || bail error "could not download cosign — the release signature cannot be checked, so nothing will be executed"
        verify "${WORK}/cosign" "${COSIGN_WANT}"
        chmod +x "${WORK}/cosign"
        curl -fsSL --retry 3 -o "${WORK}/${TGZ}.sigstore.json" "${SCANNER_BASE_URL}/${SCANNER_VERSION}/${TGZ}.sigstore.json" \
          || bail error "could not download the signature bundle for ${TGZ} — refusing to run an unverified scanner"
        if ! "${WORK}/cosign" verify-blob --bundle "${WORK}/${TGZ}.sigstore.json" \
              --certificate-identity-regexp "${SCANNER_CERT_IDENTITY_REGEXP}" \
              --certificate-oidc-issuer "${SCANNER_CERT_OIDC_ISSUER}" \
              "${WORK}/${TGZ}" >/dev/null 2>"${WORK}/cosign.err"; then
          fatal "signature verification FAILED for ${TGZ}: the digest matched but it was not signed by the Visiblaze release workflow (${SCANNER_CERT_IDENTITY_REGEXP}) — $(tail -1 "${WORK}/cosign.err"). Do not proceed by relaxing this check."
        fi
        echo "visiblaze-iac: scanner signature verified (Visiblaze release workflow)"

        tar -xzf "${WORK}/${TGZ}" -C "${BUNDLE}" || bail error "could not extract ${TGZ}"

        # The Rego checks travel with the release, so a scan never depends on a registry being up.
        # A verified bundle missing any of the three is a broken release, not an outage.
        [ -x "${BUNDLE}/visiblaze-iac" ] || fatal "the release carried no visiblaze-iac binary; nothing was executed"
        [ -x "${BUNDLE}/trivy" ] || fatal "the release carried no scanner engine; nothing was executed"
        CHECKS_DIR="${BUNDLE}/checks"
        [ -d "${CHECKS_DIR}/policy" ] || fatal "the release carried no checks bundle; a scan with no checks reports nothing and would look clean"

        # ── The merge base, on a pull request ───────────────────────────────────────────
        #
        # The pull-request check compares two uploads: one for the pull request's head and one for
        # the merge base of (base tip, head), both looked up by exact commit. A run that sends only
        # the head gives the check nothing to compare against, so every pull request reads "no
        # baseline". The same resolution the SAST and secrets actions use, for the same reasons:
        #
        #   - the checkout is shallow (actions/checkout defaults to fetch-depth 1), so deepen it
        #     here rather than asking the caller to change their checkout;
        #   - merge-base the pull request's HEAD, never the checked-out HEAD: on a pull_request
        #     event that is refs/pull/N/merge, whose first parent IS the base tip, so the answer
        #     would be the base tip instead of the fork point.
        #
        # Not fatal. Without a merge base the head is still sent, and the check says it had no
        # baseline, which is the truth.
        REL="${TARGET#"${WS}"}"
        REL="${REL#/}"
        BASE_COMMIT=""
        if [ -n "${BASE_SHA:-}" ] && [ "${IN_DRY_RUN}" != "true" ] && git -C "${WS}" rev-parse --git-dir >/dev/null 2>&1; then
          BASE_WT="${WORK}/base"
          BASE_REF_FETCHED="yes"
          git -C "${WS}" fetch --no-tags --quiet --depth=200 origin "+${BASE_SHA}:refs/visiblaze/base" 2>/dev/null \
            || git -C "${WS}" fetch --no-tags --quiet --depth=200 origin "${BASE_REF}" 2>/dev/null || true
          git -C "${WS}" fetch --no-tags --quiet --deepen=200 2>/dev/null || true
          MB_HEAD="${PR_HEAD_SHA:-}"
          [ -n "${MB_HEAD}" ] || MB_HEAD="$(git -C "${WS}" rev-parse --verify --quiet 'HEAD^2' 2>/dev/null || true)"
          [ -n "${MB_HEAD}" ] || MB_HEAD="HEAD"
          MERGE_BASE="$(git -C "${WS}" merge-base "${MB_HEAD}" "${BASE_SHA}" 2>/dev/null || true)"
          if [ -n "${MERGE_BASE}" ] \
             && git -C "${WS}" worktree add --detach --quiet "${BASE_WT}" "${MERGE_BASE}" 2>/dev/null; then
            BASE_COMMIT="${MERGE_BASE}"
            echo "visiblaze-iac: comparing against merge base ${MERGE_BASE}"
          else
            echo "::warning::visiblaze-iac: could not resolve the merge base of ${MB_HEAD} and ${BASE_SHA}; sending the head only, so this pull request's check will report no baseline"
          fi
        fi

        # ── Scan ────────────────────────────────────────────────────────────────────────
        #
        # No `set -e` from here on. Everything below either goes through bail, so fail-on-error
        # decides, or is the customer's own fail-on result. An unchecked non-zero exit would
        # bypass both and fail the customer's job for a reason they did not opt into.
        scan_tree() { # root commit out
          local root="$1" commit="$2" out="$3" path="$1" rc
          [ -z "${REL}" ] || path="$1/${REL}"
          "${BUNDLE}/visiblaze-iac" scan \
            --path "${path}" \
            --repo-root "${root}" \
            --repo-key "${REPO_KEY}" \
            --repo-name "${GH_REPOSITORY}" \
            --ref "${GH_REF_NAME}" \
            --commit "${commit}" \
            --trivy "${BUNDLE}/trivy" \
            --trivy-cache "${CHECKS_DIR}" \
            --timeout "${IN_TIMEOUT}" \
            --out "${out}"
          rc=$?
          [ "$rc" -eq 0 ] || bail error "the scan of ${commit} did not complete (exit ${rc})"
          jq -e '.findings | type == "array"' "${out}" >/dev/null 2>&1 \
            || bail error "the scan of ${commit} wrote no readable payload"
        }

        PAYLOAD="${WORK}/iac-payload.json"
        BASE_PAYLOAD="${WORK}/iac-payload-base.json"
        if [ -n "${BASE_COMMIT}" ]; then
          # The base tree may not have the scanned directory at all (the pull request adds it).
          # That is a real, empty baseline, so scan the base root and let the payload say so.
          if [ -n "${REL}" ] && [ ! -d "${BASE_WT}/${REL}" ]; then
            mkdir -p "${BASE_WT}/${REL}"
          fi
          scan_tree "${BASE_WT}" "${BASE_COMMIT}" "${BASE_PAYLOAD}"
        fi
        scan_tree "${WS}" "${GH_SHA}" "${PAYLOAD}"

        N_FIND=$(jq '.findings | length' "${PAYLOAD}")
        N_DECL=$(jq '.declarations // [] | length' "${PAYLOAD}")
        COMPLETE=$(jq -r '.complete' "${PAYLOAD}")
        STATUS="complete"

        {
          echo "findings=${N_FIND}"
          echo "declarations=${N_DECL}"
          echo "complete=${COMPLETE}"
          echo "status=${STATUS}"
        } >> "$GITHUB_OUTPUT"

        # Reported whether or not it is about to be sent. A consumer that only learns the counts
        # on a successful upload cannot report on the runs that matter.
        {
          echo "### Visiblaze — infrastructure scan"
          echo ""
          echo "| | |"
          echo "|---|---|"
          echo "| Findings | ${N_FIND} |"
          echo "| Resources located | ${N_DECL} |"
          echo "| Scan complete | ${COMPLETE} |"
          if [ -n "${BASE_COMMIT}" ]; then
            echo "| Merge base | \`${BASE_COMMIT}\` ($(jq '.findings | length' "${BASE_PAYLOAD}") finding(s)) |"
          fi
          if [ "${COMPLETE}" != "true" ]; then
            echo ""
            echo "> The scan did not read everything it was pointed at, so **no finding count here means clean**."
          fi
          jq -r '.notes // [] | .[] | "- \(.)"' "${PAYLOAD}"
        } >> "$GITHUB_STEP_SUMMARY"

        # ── Your result, not ours ───────────────────────────────────────────────────────
        #
        # fail-on is the customer's policy and is reported as-is, regardless of fail-on-error,
        # which governs only whether OUR failures break the build. Counted here, once, on the
        # head scan, and enforced on every path that follows: a dry run (which used to exit
        # before reaching it, so a policy being trialled in dry-run never fired), a sent scan,
        # and any failure of ours after this point -- bail checks HIT, because a refused upload
        # used to bail first, so an outage on our side switched the customer's own gate off.
        HIT=0
        if [ -n "${IN_FAIL_ON}" ]; then
          HIT=$(jq --arg t "${IN_FAIL_ON}" '
            ["low","medium","high","critical"] as $rank
            | ($rank | index($t)) as $ti
            | [.findings[] | (.severity // "" | ascii_downcase) as $s
                | select(($rank | index($s)) != null and ($rank | index($s)) >= $ti)] | length' "${PAYLOAD}") \
            || bail error "could not evaluate fail-on against the scan payload"
        fi
        enforce_fail_on() {
          if [ "${HIT}" -gt 0 ]; then
            echo "::error::visiblaze-iac: ${HIT} finding(s) at or above ${IN_FAIL_ON}"
            exit 2
          fi
        }

        if [ "${IN_DRY_RUN}" = "true" ]; then
          echo "delivery-status=dry-run" >> "$GITHUB_OUTPUT"
          echo "::notice::visiblaze-iac: dry run — ${N_FIND} finding(s), ${N_DECL} resource(s) located, nothing sent"
          jq -r '.findings[0:5][] | "  \(.severity)  \(.rule_id)  \(.path):\(.start_line)"' "${PAYLOAD}"
          enforce_fail_on
          exit 0
        fi

        # ── Send ────────────────────────────────────────────────────────────────────────
        #
        # A pull request from a FORK gets no OIDC token, whatever the workflow asks for. It was
        # scanned and its fail-on is enforced below; nothing is sent, and that is said, not failed.
        if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] && [ "${GH_EVENT:-}" = "pull_request" ] \
           && [ -n "${PR_HEAD_REPO:-}" ] && [ "${PR_HEAD_REPO}" != "${GH_REPOSITORY:-}" ]; then
          echo "::warning::visiblaze-iac: this pull request comes from a fork (${PR_HEAD_REPO}), and GitHub issues no OIDC token to fork pull requests. Scanned on this runner and fail-on enforced; nothing was sent to Visiblaze."
          echo "delivery-status=failed" >> "$GITHUB_OUTPUT"
          enforce_fail_on
          exit 0
        fi
        if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
          bail error "no OIDC token available — add 'permissions: { id-token: write }' to this job"
        fi
        AUDIENCE="visiblaze-iac-findings"
        # Both bearer values reach curl through --config on a file in the 0700 work directory,
        # written by printf (a builtin, so on no argv). argv is readable by every user on the machine,
        # and a self-hosted runner is a shared one.
        ( umask 077; printf 'header = "Authorization: bearer %s"\n' "${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" > "${WORK}/mint.cfg" )
        OIDC=$(curl -sS --config "${WORK}/mint.cfg" \
          "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUDIENCE}" 2>/dev/null | jq -r '.value // empty')
        rm -f "${WORK}/mint.cfg"
        [ -n "${OIDC}" ] || bail error "could not mint an OIDC token for ${AUDIENCE}"
        echo "::add-mask::${OIDC}"
        ( umask 077; printf 'header = "Authorization: Bearer %s"\n' "${OIDC}" > "${WORK}/upload.cfg" )

        send() { # payload label
          local body="${WORK}/response-$2.json" code
          gzip -c "$1" > "${WORK}/payload-$2.gz"
          code=$(curl -sS -o "${body}" -w '%{http_code}' \
            --config "${WORK}/upload.cfg" \
            -X POST "${IN_API_URL}" \
            -H "Content-Type: application/json" \
            -H "Content-Encoding: gzip" \
            -H "x-visiblaze-tenant: ${IN_TENANT}" \
            --data-binary "@${WORK}/payload-$2.gz") || true
          case "${code}" in
            2*) echo "::notice::visiblaze-iac: sent the $2 scan: $(jq '.findings | length' "$1") finding(s), $(jq '.declarations // [] | length' "$1") resource location(s)" ;;
            *)  bail error "the ingest refused the $2 upload (HTTP ${code}): $(head -c 300 "${body}" 2>/dev/null)" ;;
          esac
        }
        # Base first. Each upload re-queues the pull request's check, and the head's re-queue is
        # the one that should find both sides already stored.
        [ -z "${BASE_COMMIT}" ] || send "${BASE_PAYLOAD}" "merge-base"
        send "${PAYLOAD}" "head"
        rm -f "${WORK}/upload.cfg"
        echo "delivery-status=sent" >> "$GITHUB_OUTPUT"

        enforce_fail_on
